name: Update NEXT_ITERATION_NUMBER after iteration merge

on:
  pull_request:
    types: [closed]
    branches: [Release-Non-Prod]

permissions:
  contents: read

concurrency:
  group: update-next-iteration-number
  cancel-in-progress: false

jobs:
  update_repo_variable:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'Pre-Release-Iteration-')
    runs-on: ubuntu-latest

    steps:
      - name: Update repository variable NEXT_ITERATION_NUMBER
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          ITERATION_BRANCH: ${{ github.event.pull_request.head.ref }}
          VARIABLE_NAME: NEXT_ITERATION_NUMBER
        run: |
          python3 - <<'PY'
          import os, re, json
          import urllib.request, urllib.parse, urllib.error

          token = os.environ["GH_TOKEN"]
          api_url = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          iteration_branch = os.environ["ITERATION_BRANCH"]
          variable_name = os.environ["VARIABLE_NAME"]

          owner, name = repo.split("/", 1)
          base = f"{api_url}/repos/{owner}/{name}"

          def api_request(method, url, payload=None):
            data = None
            headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "update-next-iteration-number-workflow"
            }

            if payload is not None:
              data = json.dumps(payload).encode("utf-8")
              headers["Content-Type"] = "application/json"

            req = urllib.request.Request(url, data=data, headers=headers, method=method)

            try:
              with urllib.request.urlopen(req) as resp:
                body = resp.read().decode("utf-8")
                return resp.status, json.loads(body) if body else None
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8") if e.fp else ""
              try:
                parsed = json.loads(body) if body else {"message": str(e)}
              except Exception:
                parsed = {"message": body or str(e)}
              return e.code, parsed

          m = re.search(r"(\d+)$", iteration_branch)
          if not m:
            raise SystemExit(f"Could not parse iteration number from branch: {iteration_branch}")

          merged_iteration = int(m.group(1))
          new_next = merged_iteration + 1

          print(f"Merged iteration branch: {iteration_branch}")
          print(f"Setting {variable_name}={new_next}")

          get_url = f"{base}/actions/variables/{urllib.parse.quote(variable_name, safe='')}"
          create_url = f"{base}/actions/variables"

          status, data = api_request("GET", get_url)

          if status == 200:
            current_value = data.get("value")
            print(f"Existing variable found. Current value: {current_value}")

            if str(current_value) == str(new_next):
              print(f"{variable_name} already set to {new_next}. Nothing to do.")
              raise SystemExit(0)

            status, data = api_request(
              "PATCH",
              get_url,
              {
                "name": variable_name,
                "value": str(new_next)
              }
            )

            if status != 204:
              raise SystemExit(f"Failed to update repository variable: HTTP {status} {data}")

            print(f"Updated {variable_name} to {new_next}")

          elif status == 404:
            print(f"Variable {variable_name} does not exist yet. Creating it...")

            status, data = api_request(
              "POST",
              create_url,
              {
                "name": variable_name,
                "value": str(new_next)
              }
            )

            if status != 201:
              raise SystemExit(f"Failed to create repository variable: HTTP {status} {data}")

            print(f"Created {variable_name}={new_next}")

          else:
            raise SystemExit(f"Failed to read repository variable: HTTP {status} {data}")
          PY