name: Open PR from latest Pre-Release Iteration to main (biweekly on Fridays, 5pm EST)

on:
  # Cron is evaluated in UTC.
  # 22:00 UTC == 17:00 EST 
  # NOTE: This is fixed to EST (no DST adjustment).
  schedule:
    - cron: "0 22 * * 5"

  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to merge into (default is main)"
        required: false
        default: "main"
        type: string
      prefix:
        description: "Iteration branch prefix"
        required: false
        default: "Pre-Release-Iteration-"
        type: string
      assignee:
        description: "GitHub username to assign the PR to (manual runs only)"
        required: false
        default: "enzo-z"
        type: string
      reviewer:
        description: "Optional GitHub username to request review from (manual runs only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write  # needed because assigning uses the Issues API

concurrency:
  group: open-pr-latest-iteration-biweekly
  cancel-in-progress: false

jobs:
  open_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create/ensure PR for latest iteration branch (biweekly gate on Fridays)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

          BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || 'main' }}
          PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.prefix || 'Pre-Release-Iteration-' }}

          ASSIGNEE: ${{ github.event_name == 'workflow_dispatch' && inputs.assignee || 'enzo-z' }} # Change default as needed
          REVIEWER: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewer || '' }}
        run: |
          python3 - <<'PY'
          import os, re, json
          import urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone

          # ----------------------------
          # Biweekly gate (schedule only)
          # ----------------------------
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")

          if event_name == "schedule":
            # Anchor: Friday 2026-01-23 00:00 UTC (week bucket)
            ANCHOR = datetime(2026, 1, 23, 0, 0, tzinfo=timezone.utc)

            now = datetime.now(timezone.utc)

            # "This Friday" bucket starts Friday 00:00 UTC
            # weekday(): Monday=0 ... Friday=4
            days_since_friday = (now.weekday() - 4) % 7
            this_friday = (now - timedelta(days=days_since_friday)).replace(
              hour=0, minute=0, second=0, microsecond=0
            )

            weeks_since_anchor = (this_friday - ANCHOR).days // 7
            if weeks_since_anchor < 0:
              print(f"Before anchor week (weeks_since_anchor={weeks_since_anchor}). Exiting.")
              raise SystemExit(0)

            # Run only on even buckets: 0,2,4...
            if weeks_since_anchor % 2 != 0:
              print(f"Off-week (weeks_since_anchor={weeks_since_anchor}). Exiting.")
              raise SystemExit(0)

            print(f"On-week (weeks_since_anchor={weeks_since_anchor}). Proceeding.")
          else:
            print(f"Non-schedule run ({event_name}); bypassing biweekly gate.")

          # ----------------------------
          # Main logic
          # ----------------------------
          token = os.environ["GH_TOKEN"]
          api_url = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          base_branch = os.environ["BASE_BRANCH"]
          prefix = os.environ["PREFIX"]
          assignee = (os.environ.get("ASSIGNEE") or "").strip()
          reviewer = (os.environ.get("REVIEWER") or "").strip()

          if not assignee:
            raise SystemExit("ASSIGNEE is empty. Set it in workflow env/inputs/vars.")

          owner, name = repo.split("/", 1)
          base = f"{api_url}/repos/{owner}/{name}"

          def api_request(method, url, payload=None):
            data = None
            headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "open-latest-iteration-pr-workflow"
            }
            if payload is not None:
              data = json.dumps(payload).encode("utf-8")
              headers["Content-Type"] = "application/json"
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
              with urllib.request.urlopen(req) as resp:
                body = resp.read().decode("utf-8")
                return resp.status, json.loads(body) if body else None
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8") if e.fp else ""
              try:
                parsed = json.loads(body) if body else {"message": str(e)}
              except Exception:
                parsed = {"message": body or str(e)}
              return e.code, parsed

          # 1) Find latest iteration branch (highest number)
          pattern = re.compile(rf"^{re.escape(prefix)}(\d+)$")
          max_n = 0
          latest_branch = None
          page = 1

          while True:
            url = f"{base}/branches?per_page=100&page={page}"
            status, branches = api_request("GET", url)
            if status != 200:
              raise SystemExit(f"Failed to list branches: HTTP {status} {branches}")

            if not branches:
              break

            for b in branches:
              bn = b.get("name", "")
              m = pattern.match(bn)
              if m:
                n = int(m.group(1))
                if n > max_n:
                  max_n = n
                  latest_branch = bn

            page += 1

          if not latest_branch:
            print(f"No branches found matching {prefix}<number>. Nothing to do.")
            raise SystemExit(0)

          print(f"Latest iteration branch: {latest_branch}")

          # 2) Check if an open PR already exists from latest_branch -> base_branch
          head = urllib.parse.quote(f"{owner}:{latest_branch}", safe="")
          base_q = urllib.parse.quote(base_branch, safe="")
          pulls_url = f"{base}/pulls?state=open&head={head}&base={base_q}"
          status, pulls = api_request("GET", pulls_url)
          if status != 200:
            raise SystemExit(f"Failed to query existing PRs: HTTP {status} {pulls}")

          if pulls and isinstance(pulls, list) and len(pulls) > 0:
            pr = pulls[0]
            print(f"PR already exists: #{pr.get('number')} {pr.get('html_url')}")
            raise SystemExit(0)

          # 3) Create the PR
          create_pr_url = f"{base}/pulls"
          payload = {
            "title": f"Merge {latest_branch} -> {base_branch}",
            "head": latest_branch,
            "base": base_branch,
            "body": (
              f"Automated PR created by GitHub Actions.\n\n"
              f"Source: `{latest_branch}`\n"
              f"Target: `{base_branch}`\n"
            ),
            "maintainer_can_modify": True
          }
          status, pr = api_request("POST", create_pr_url, payload)
          if status not in (200, 201):
            raise SystemExit(f"Failed to create PR: HTTP {status} {pr}")

          pr_number = pr["number"]
          print(f"Created PR #{pr_number}: {pr.get('html_url')}")

          # 4) Assign a user (assignee)
          issue_url = f"{base}/issues/{pr_number}"
          status, resp = api_request("PATCH", issue_url, {"assignees": [assignee]})
          if status not in (200, 201):
            raise SystemExit(f"Failed to assign PR: HTTP {status} {resp}")
          print(f"Assigned PR to: {assignee}")

          # 5) Optionally request a reviewer
          if reviewer:
            reviewers_url = f"{base}/pulls/{pr_number}/requested_reviewers"
            status, resp = api_request("POST", reviewers_url, {"reviewers": [reviewer]})
            if status not in (200, 201):
              raise SystemExit(f"Failed to request reviewer: HTTP {status} {resp}")
            print(f"Requested review from: {reviewer}")
          PY
