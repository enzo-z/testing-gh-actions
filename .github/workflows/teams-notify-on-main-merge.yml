name: Notify Teams on merge to Release-Non-Prod (with included PRs)

on:
  pull_request:
    types: [closed]
    branches: [Release-Non-Prod] # base branch (target)

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Only run when PR was merged AND it was from an iteration branch
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'Pre-Release-Iteration-')
    runs-on: ubuntu-latest

    steps:
      - name: Build message (find PRs merged into iteration branch)
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: main
          MERGED_FROM_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request, re

          token = os.environ["GH_TOKEN"]
          api_url = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          merged_from = os.environ["MERGED_FROM_BRANCH"]
          merge_pr_title = os.environ.get("MERGE_PR_TITLE","")
          merge_pr_url = os.environ.get("MERGE_PR_URL","")

          owner, name = repo.split("/", 1)
          base = f"{api_url}/repos/{owner}/{name}"

          def api_request(url):
            headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "teams-notify-workflow"
            }
            req = urllib.request.Request(url, headers=headers, method="GET")
            with urllib.request.urlopen(req) as resp:
              body = resp.read().decode("utf-8")
              return resp.status, json.loads(body) if body else None

          # Search merged PRs whose BASE is the iteration branch
          # This uses GitHub search qualifiers (repo, is:pr, is:merged, base:branch). :contentReference[oaicite:3]{index=3}
          query = f"repo:{repo} is:pr is:merged base:{merged_from}"
          q = urllib.parse.quote(query, safe="")
          per_page = 100
          page = 1
          items = []

          while True:
            url = f"{api_url}/search/issues?q={q}&per_page={per_page}&page={page}"
            status, data = api_request(url)
            if status != 200:
              raise SystemExit(f"Search failed: HTTP {status} {data}")

            batch = data.get("items", [])
            if not batch:
              break

            items.extend(batch)

            # stop if we've got all results
            total = data.get("total_count", 0)
            if len(items) >= total:
              break

            page += 1
            if page > 10:  # safety cap (max 1000 results)
              break

          # Build a readable list (cap to avoid huge Teams messages)
          MAX_LIST = 25
          lines = []
          for pr in items[:MAX_LIST]:
            number = pr.get("number")
            title = (pr.get("title") or "").strip()
            url = pr.get("html_url") or pr.get("url") or ""
            lines.append(f"- #{number} {title} ({url})")

          remaining = len(items) - len(lines)
          if remaining > 0:
            lines.append(f"- …and {remaining} more")

          pr_list_text = "\n".join(lines) if lines else "- (No PRs found merged into that branch)"

          message = (
            f"A new version of **{default_branch}** was generated!\n\n"
            f"This new version was a result of the work done in **{merged_from}**.\n\n"
            f"Merge PR: {merge_pr_title} ({merge_pr_url})\n\n"
            f"**Changes included in this version:**\n{pr_list_text}"
          )

          # Write to GITHUB_OUTPUT for the next step
          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as f:
            f.write("message<<EOF\n")
            f.write(message)
            f.write("\nEOF\n")

          print(message)
          PY

      - name: Send message to Microsoft Teams (Workflows webhook)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }} # NEEDS TO IMPLEMENT THIS SECRET
          MESSAGE: ${{ steps.build.outputs.message }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "Missing TEAMS_WEBHOOK_URL secret"
            exit 1
          fi

          # Send payload that your Teams Workflow can read (e.g., { "text": "..." }).
          # In the Teams Workflow, map 'text' into the message body.
          payload=$(python3 - <<'PY'
          import os, json
          print(json.dumps({"text": os.environ["MESSAGE"]}))
          PY
          )

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
